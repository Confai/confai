[supervisord]
nodaemon=true

[program:gunicorn]
command=gunicorn --bind=0.0.0.0 --timeout 600 core.wsgi
autostart=true
autorestart=true
stdout_logfile=/var/log/gunicorn.log
stderr_logfile=/var/log/gunicorn_err.log

[program:celery_worker]
command=celery -A core worker -l INFO
autostart=true
autorestart=true
stdout_logfile=/var/log/celery_worker.log
stderr_logfile=/var/log/celery_worker_err.log

[program:celery_beat]
command=celery -A core beat -l INFO
autostart=true
autorestart=true
stdout_logfile=/var/log/celery_beat.log
stderr_logfile=/var/log/celery_beat_err.log

[program:scheduletask]
command=python scheduletask.py
autostart=true
autorestart=true
stdout_logfile=/var/log/scheduletask.log
stderr_logfile=/var/log/scheduletask_err.log
